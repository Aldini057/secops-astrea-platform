version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: astrea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: \
      POSTGRES_PASSWORD: \
      POSTGRES_DB: \
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - astrea_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \ -d \"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: astrea_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=\
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Mexico_City
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=\
      - DB_POSTGRESDB_USER=\
      - DB_POSTGRESDB_PASSWORD=\
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - astrea_network

  nvd_service:
    build:
      context: ./services/nvd_service
      dockerfile: Dockerfile
    container_name: astrea_nvd_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NVD_API_KEY=\
      - DATABASE_URL=postgresql://\:\@postgres:5432/\
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - astrea_network

  dashboard_bid:
    build:
      context: ./services/dashboard_bid
      dockerfile: Dockerfile
    container_name: astrea_dashboard_bid
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=\
      - DB_USER=\
      - DB_PASSWORD=\
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - astrea_network

networks:
  astrea_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
